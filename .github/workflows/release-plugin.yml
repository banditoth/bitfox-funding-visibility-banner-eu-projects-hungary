name: Build and release WordPress plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package plugin and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches plugin version
        id: version
        shell: bash
        run: |
          plugin_file="bitfox-funding-visibility-banner-eu-projects-hungary/bitfox-funding-visibility-banner-eu-projects-hungary.php"
          version="$(sed -n 's/^[[:space:]]*\* Version: \([0-9][0-9.]*\)[[:space:]]*$/\1/p' "$plugin_file" | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" || "$tag" != "$version" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match plugin version ${version:-unknown}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check PHP and JavaScript syntax
        shell: bash
        run: |
          php -l bitfox-funding-visibility-banner-eu-projects-hungary/bitfox-funding-visibility-banner-eu-projects-hungary.php
          php -l bitfox-funding-visibility-banner-eu-projects-hungary/includes/class-eusv-plugin.php
          node --check bitfox-funding-visibility-banner-eu-projects-hungary/assets/admin.js
          node --check bitfox-funding-visibility-banner-eu-projects-hungary/assets/public.js

      - name: Build installable ZIP
        run: zip -r "bitfox-funding-visibility-banner-eu-projects-hungary-${{ steps.version.outputs.version }}.zip" bitfox-funding-visibility-banner-eu-projects-hungary -x '*/.DS_Store'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: bitfox.hu EU Funding Banner - Hungary ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: bitfox-funding-visibility-banner-eu-projects-hungary-${{ steps.version.outputs.version }}.zip
